name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  ANONYMIZED_TELEMETRY: "False"
  OTEL_SDK_DISABLED: "true"
  DO_NOT_TRACK: "1"

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - run: python tools/check_repository.py
      - run: python tools/catalog.py --check
      - run: python -m unittest discover -s tools/tests -v

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m ruff check app tests tools
      - run: python -m black --check app tests tools
      - run: python -m mypy app --ignore-missing-imports
      - run: python tools/offline_pytest.py -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: backend-${{ matrix.os }}
          path: |
            backend/junit.xml
            backend/coverage.xml
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --include=dev --bin-links=true
      - run: npm run typecheck
      - run: npm run typecheck:browser-contract
      - run: npm run lint
      - run: npm run test:coverage -- --maxWorkers=1
      - run: npm run test:ui-checker
      - run: npm audit --audit-level=moderate
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      RAG_TEST_VECTOR_BACKEND: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install -r ../backend/requirements-test.txt
      - name: Select the installed Python executable
        run: python -c "import os,sys; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8').write('PYTHON_EXECUTABLE='+sys.executable+'\n')"
      - run: npm ci --include=dev --bin-links=true
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:ui-compare
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: controlled-browser-results
          path: frontend/test-results/
          retention-days: 7

  docker-config:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose -p rag-mvp-review-ci config --quiet
      - name: Build images only on explicit manual CI dispatch
        if: github.event_name == 'workflow_dispatch'
        run: docker compose -p rag-mvp-review-ci build
