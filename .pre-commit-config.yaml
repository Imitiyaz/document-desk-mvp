repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: python
        additional_dependencies: [black==26.5.1]
        files: ^backend/.*\.py$
      - id: ruff
        name: ruff check
        entry: ruff check
        language: python
        additional_dependencies: [ruff==0.15.21]
        files: ^backend/.*\.py$
      - id: repository-check
        name: public source and documentation check
        entry: python tools/check_repository.py
        language: system
        pass_filenames: false
        always_run: true
