[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not embedding_model and not vectorstore and not ollama"
markers =
    embedding_model: requires downloading/running the real embedding model (network + slow); excluded from the default run -- run explicitly with `pytest -m embedding_model`
    vectorstore: requires the real chromadb library installed; excluded from the default run -- run explicitly with `pytest -m vectorstore`
    ollama: requires a real, locally running Ollama instance (opt-in model evaluation); excluded from the default run -- run explicitly with `pytest -m ollama`
